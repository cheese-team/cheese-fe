language: ko-KR

tone_instructions: >
  안정성, 가독성, 유지보수성, 일관성을 중점적으로 검토합니다.
  버그와 타입 안정성을 우선하며 과도한 취향성 리팩토링은 지양합니다.

reviews:
  profile: chill

  request_changes_workflow: false

  high_level_summary: true
  changed_files_summary: true
  sequence_diagrams: false

  assess_linked_issues: true
  related_issues: false
  related_prs: false

  suggested_labels: false
  auto_apply_labels: false

  suggested_reviewers: false
  auto_assign_reviewers: false

  poem: true

  path_instructions:
    - path: 'src/**/*.{ts,tsx}'
      instructions: |
        1. 버그 가능성, 잘못된 로직, 타입 안정성, null/undefined 처리, 예외 처리를 우선적으로 확인해주세요.
        2. 불필요한 상태 저장이나 useEffect를 이용한 상태 동기화가 없는지 확인해주세요.
        3. 기존 프로젝트 구조, 네이밍, 구현 패턴과의 일관성을 확인해주세요.
        4. 단순 취향에 따른 변경이나 실질적인 이점이 없는 리팩토링은 제안하지 마세요.
        5. 문제를 지적할 때는 원인, 발생 가능한 영향, 개선 방향을 함께 설명해주세요.
        6. 공식 문서가 문제 이해에 실질적으로 도움이 되는 경우 React, Next.js, TypeScript 등의 공식 문서를 우선 참고해주세요.

    - path: 'src/components/common/**/*.{ts,tsx}'
      instructions: |
        1. 여러 화면에서 재사용되는 공통 컴포넌트라는 점을 고려해 API의 범용성과 일관성을 검토해주세요.
        2. 특정 페이지의 요구사항이 공통 컴포넌트에 과도하게 결합되지 않았는지 확인해주세요.
        3. props와 타입이 컴포넌트의 역할을 명확하게 표현하는지 확인해주세요.
        4. 기존 props나 동작 변경으로 다른 사용처에 영향을 줄 가능성이 있는지 확인해주세요.
        5. 기존 공통 컴포넌트로 처리 가능한 기능을 중복 구현하고 있지 않은지 확인해주세요.
        6. 접근성과 기본 HTML 동작을 불필요하게 훼손하고 있지 않은지 확인해주세요.

    - path: 'src/app/**/*.{ts,tsx}'
      instructions: |
        1. Next.js App Router의 구조와 역할에 맞게 구현되었는지 확인해주세요.
        2. Client Component가 필요한 범위보다 넓게 사용되고 있지 않은지 확인해주세요.
        3. 페이지 컴포넌트가 지나치게 많은 UI와 비즈니스 로직을 직접 담당하고 있지 않은지 검토해주세요.
        4. Link, Router, searchParams 등 Next.js에서 제공하는 기능을 적절하게 사용하고 있는지 확인해주세요.
        5. 라우트별 로직이나 컴포넌트가 불필요하게 다른 도메인과 강하게 결합되지 않았는지 확인해주세요.

    - path: 'src/api/**/*.{ts,tsx}'
      instructions: |
        1. API 요청 및 응답 타입이 명확하게 정의되어 있는지 확인해주세요.
        2. HTTP 오류 및 예상하지 못한 응답에 대한 처리가 적절한지 검토해주세요.
        3. endpoint 또는 반복되는 요청 로직이 불필요하게 중복되지 않았는지 확인해주세요.
        4. 인증 정보나 민감한 값이 클라이언트 코드에 직접 노출되지 않는지 확인해주세요.
        5. API 레이어와 UI 레이어의 책임이 적절하게 분리되어 있는지 확인해주세요.

    - path: 'src/queries/**/*.{ts,tsx}'
      instructions: |
        1. queryKey가 데이터 범위와 파라미터를 안정적으로 표현하는지 확인해주세요.
        2. query와 mutation의 역할이 적절하게 분리되어 있는지 확인해주세요.
        3. mutation 이후 invalidateQueries 또는 캐시 업데이트가 필요한 경우 누락되지 않았는지 확인해주세요.
        4. 불필요한 refetch나 중복 요청이 발생할 가능성이 있는지 검토해주세요.
        5. 서버 상태를 불필요하게 별도의 로컬 state로 복제하고 있지 않은지 확인해주세요.

  auto_review:
    enabled: true
    auto_incremental_review: true

chat:
  auto_reply: true

knowledge_base:
  web_search:
    enabled: true

  code_guidelines:
    enabled: true
    filePatterns:
      - docs/code-convention.md

  learnings:
    scope: local
  issues:
    scope: local
  pull_requests:
    scope: local
